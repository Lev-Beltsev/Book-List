<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Список Книг</title>
</head>
<body>
    <div class="container">

        <h1>📚 Список книг</h1>

        <!-- Форма добавления -->

        <form class="add-book-form" id="addBookForm">
                <input type="text" id="bookTitle" placeholder="Название книги" required> 
                <input type="text" id="bookAuthor" placeholder="Автор" required>
                <button type="submit">Добавить Книгу</button> 
        </form>

        <!-- Кнопки Фильтров -->
        <div class="filters"> 
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="read">Прочитанные</button>
            <button class="filter-btn" data-filter="unread">Непрочитанные</button>
        </div>

        <!-- Список книг -->
        <div class="book-list" id="bookList"> </div>
    </div>
<script src="./script/script.js"> </script>
</body>
</html>
